name: Post rlxed Instagram Carousel

on:
  schedule:
    # 7:00 AM IST = 1:30 AM UTC
    - cron: "30 1 * * *"
    # 7:00 PM IST = 1:30 PM UTC
    - cron: "30 13 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit generated images back

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate carousel slides
        id: generate
        run: |
          OUTPUT=$(python scripts/generate_carousel.py)
          echo "$OUTPUT"
          echo "post_dir=$(echo "$OUTPUT" | python -c "import json,sys; print(json.load(sys.stdin)['post_dir'])")" >> "$GITHUB_OUTPUT"

      - name: Commit and push generated images
        run: |
          git config user.name "rlxed-bot"
          git config user.email "rlxed-bot@users.noreply.github.com"
          git add content/generated state/state.json
          git commit -m "Generate carousel: ${{ steps.generate.outputs.post_dir }}"
          git push

      - name: Wait for GitHub CDN to catch up
        run: sleep 15

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.38924023033908560 }}
          IG_ACCESS_TOKEN: ${{ secrets.IGAAZAbiZA1aai9BZAGFvMFpNWDNsZAFBkWGxDQlF1ZAUlyWXpqYkRnS01CUXk3YzZAmMndtRThOZATM4ZAHJKOERkWmJxZA1kzQXVJNnBIOHpxWjJCUFJpaFlGZAzZANaG5EUVdpc2N2VkY0MkxqZAVhWLUp2Q3dKMHFfY3UzZAm10Q29vc09JQQZDZD }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THAAXcDbSjnQ9BYllFdDNYNHZAnd3dxSDA1MHk3T25JVUE5bWFGUFMyaFQxd2tONm0ydDlHWTJQbHJBUVFsWEpoYl9ITUsxN3gySVJMelZAyUGU5dW1SRUNwZA2FrdU5nS051YXdoMmNjSzJCVGc3c0xya2lsalRmcVJ3TmY3M2NPaVZAGM0JSSkhqRnBodXI4OFUZD }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.https://graph.facebook.com/v25.0/me?fields=id,name&access_token=EAAYdXt5wV00BSvWdRqvxjZCi9lrSCtRipbQ8RnrEx6Jb5ZA90B8EnZB7UAnUcfH9mQyNaWytD1gYjubCTBEP5kZBXvvZBxTSBGxpQmq9J4hLpuNogNiMcMFk5XS3d5sGYadBIqFZAfqd4zFAgciZApyPJTAL6MFUTzRBPK34lUMJD1mcHEiSldf73OUVZBkk3aXH8wZDZD }}
        run: python scripts/publish_carousel.py "${{ steps.generate.outputs.post_dir }}"
